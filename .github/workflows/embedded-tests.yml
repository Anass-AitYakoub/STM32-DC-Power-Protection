
name: Firmware and Python Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedded-c-tests:
    name: Embedded C Protection Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile protection tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O0 -UNDEBUG \
            -IInc \
            Src/protection.c \
            Src/critical_fault.c \
            tests/test_protection_timed.c \
            -o test_protection_timed \
            -lm

      - name: Run protection tests
        run: ./test_protection_timed

  python-tests:
    name: Python Protocol Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Run Python unit tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v
